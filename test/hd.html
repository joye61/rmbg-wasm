<!doctype html>
<meta charset="utf-8">
<title>rmbg-wasm HD test</title>
<script type="module">
import { removeBackground } from '../src/index.js';

window.__log = [];
const log = (...a) => { window.__log.push(a.map(x => (x && x.stack) || String(x)).join(' ')); console.log(...a); };

function toURL(id) {
  const cv = document.createElement('canvas'); cv.width = id.width; cv.height = id.height;
  cv.getContext('2d').putImageData(id, 0, 0);
  return cv.toDataURL('image/png');
}
function alphaStats(data) {
  let o = 0, t = 0, s = 0, sum = 0;
  for (let i = 3; i < data.length; i += 4) { const a = data[i]; sum += a; if (a === 255) o++; else if (a === 0) t++; else s++; }
  return { opaque: o, transp: t, semi: s, avgAlpha: +(sum / (data.length / 4)).toFixed(2) };
}
function semiRatio(data) { let s = 0; for (let i = 3; i < data.length; i += 4) if (data[i] > 0 && data[i] < 255) s++; return s / (data.length / 4); }

(async () => {
  try {
    let t = performance.now();
    const def = await removeBackground('sample.jpg', { output: 'imageData' });
    const defMs = Math.round(performance.now() - t);
    window.__cutoutURL = toURL(def);

    t = performance.now();
    const hd = await removeBackground('sample.jpg', { output: 'imageData', hd: true });
    const hdMs = Math.round(performance.now() - t);
    window.__harmURL = toURL(hd);

    t = performance.now();
    const capped = await removeBackground('sample.jpg', { output: 'imageData', maxSize: 32 });
    const cappedMs = Math.round(performance.now() - t);
    window.__edgeURL = toURL(capped);

    const sameAsDefault = (() => {
      if (hd.width !== def.width || hd.height !== def.height) return false;
      let diff = 0;
      for (let i = 0; i < def.data.length; i++) if (def.data[i] !== hd.data[i]) diff++;
      return diff === 0;
    })();

    window.__result = {
      default: { ms: defMs, ...alphaStats(def.data) },
      hd: { ms: hdMs, ...alphaStats(hd.data) },
      capped: { ms: cappedMs, w: capped.width, h: capped.height, ...alphaStats(capped.data) },
      hdEqualsDefault: sameAsDefault,
      hdSemiRatio: +semiRatio(hd.data).toFixed(4),
      defSemiRatio: +semiRatio(def.data).toFixed(4),
    };
    log('DONE', JSON.stringify(window.__result));
  } catch (e) {
    window.__error = String((e && e.stack) || e);
    log('ERR', e);
  }
  window.__ready = true;
})();
</script>
