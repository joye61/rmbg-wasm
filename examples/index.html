<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>rmbg-wasm example</title>
  <style>
    body { font: 15px/1.5 system-ui, sans-serif; max-width: 820px; margin: 40px auto; padding: 0 16px; }
    #drop { border: 2px dashed #aaa; border-radius: 12px; padding: 32px; text-align: center; color: #666; cursor: pointer; }
    #drop.hover { border-color: #4c8bf5; color: #4c8bf5; }
    .row { display: flex; gap: 16px; flex-wrap: wrap; margin-top: 20px; }
    figure { margin: 0; flex: 1 1 300px; }
    img { width: 100%; border-radius: 8px; background: repeating-conic-gradient(#eee 0 25%, #fff 0 50%) 50% / 20px 20px; }
    figcaption { font-size: 13px; color: #666; margin-top: 6px; }
    #status { margin-top: 16px; min-height: 22px; color: #333; }
    progress { width: 100%; }
  </style>
</head>
<body>
  <h1>rmbg-wasm</h1>
  <p>Drop an image below. Everything runs locally in your browser.</p>

  <div id="drop">Drop an image here, or click to choose a file</div>
  <input id="file" type="file" accept="image/*" hidden>

  <div class="row" style="margin-top:16px">
    <button data-op="remove">Remove background</button>
    <button data-op="colorize">AI color</button>
    <button data-op="edgeEnhance">Edge enhance</button>
    <button id="preload-btn">Preload (init progress)</button>
    <label style="display:flex;align-items:center;gap:6px;font-size:14px">
      <input type="checkbox" id="usehd"> HD edges
    </label>
  </div>

  <div class="row">
    <figure><img id="original" alt="original"><figcaption>Original</figcaption></figure>
    <figure><img id="result" alt="result"><figcaption id="result-caption">Result</figcaption></figure>
  </div>

  <div id="status"></div>
  <progress id="progress" value="0" max="1"></progress>

  <script type="module">
    import { removeBackground, colorize, edgeEnhance, load } from '../src/index.js';

    const drop = document.getElementById('drop');
    const fileInput = document.getElementById('file');
    const status = document.getElementById('status');
    const bar = document.getElementById('progress');
    const originalImg = document.getElementById('original');
    const resultImg = document.getElementById('result');
    const resultCaption = document.getElementById('result-caption');
    let resultUrl = null;
    let currentFile = null;

    drop.addEventListener('click', () => fileInput.click());
    drop.addEventListener('dragover', (e) => { e.preventDefault(); drop.classList.add('hover'); });
    drop.addEventListener('dragleave', () => drop.classList.remove('hover'));
    drop.addEventListener('drop', (e) => {
      e.preventDefault();
      drop.classList.remove('hover');
      if (e.dataTransfer.files[0]) { currentFile = e.dataTransfer.files[0]; run(currentFile, 'remove'); }
    });
    fileInput.addEventListener('change', () => {
      currentFile = fileInput.files[0];
      if (currentFile) run(currentFile, 'remove');
    });

    const ops = {
      remove: { fn: removeBackground, label: 'Background removed' },
      colorize: { fn: colorize, label: 'AI colored' },
      edgeEnhance: { fn: edgeEnhance, label: 'Edge enhanced' },
    };
    document.querySelectorAll('button[data-op]').forEach((btn) => {
      btn.addEventListener('click', () => { if (currentFile) run(currentFile, btn.dataset.op); });
    });

    document.getElementById('preload-btn').addEventListener('click', async () => {
      status.textContent = 'Preloading…';
      try {
        const info = await load({
          harmonization: true, // also preload the AI-coloring model
          onProgress: (s) => {
            if (s.phase !== 'loading') return;
            const pct = (s.stageIndex + s.ratio) / s.stageCount;
            bar.value = pct;
            status.textContent = `Loading ${s.stage}… ${Math.round(s.ratio * 100)}% (${s.stageIndex + 1}/${s.stageCount})`;
          },
        });
        bar.value = 1;
        status.textContent = `Preloaded: ${info.stages.join(', ')} (simd=${info.useSimd}, threads=${info.useThreads})`;
      } catch (err) {
        status.textContent = 'Error: ' + err.message;
      }
    });

    async function run(file, op) {
      if (resultUrl) URL.revokeObjectURL(resultUrl);
      originalImg.src = URL.createObjectURL(file);
      bar.value = 0;
      resultCaption.textContent = ops[op].label;
      status.textContent = 'Starting…';
      const t0 = performance.now();
      try {
        const blob = await ops[op].fn(file, {
          output: 'blob',
          hd: document.getElementById('usehd').checked ? true : undefined,
          // Caller-owned progress UI, driven purely by the package's progress data.
          onProgress: (state) => {
            const pct = state.phase === 'loading' ? state.ratio * 0.3 : 0.3 + state.ratio * 0.7;
            bar.value = pct;
            status.textContent = state.phase === 'loading'
              ? `Loading ${state.stage}… ${Math.round(pct * 100)}%`
              : state.phase === 'processing'
                ? `${ops[op].label}… ${Math.round(pct * 100)}%`
                : 'Done';
          },
        });
        resultUrl = URL.createObjectURL(blob);
        resultImg.src = resultUrl;
        status.textContent = `Done in ${((performance.now() - t0) / 1000).toFixed(1)}s`;
      } catch (err) {
        status.textContent = 'Error: ' + err.message;
        console.error(err);
      }
    }
  </script>
</body>
</html>
