<!doctype html>
<meta charset="utf-8">
<title>rmbg-wasm batch test</title>
<script type="module">
import { batch } from '../src/index.js';

window.__log = [];
const log = (...a) => { window.__log.push(a.map(x => (x && x.stack) || String(x)).join(' ')); console.log(...a); };

(async () => {
  try {
    const t0 = performance.now();
    const results = await batch(['sample.jpg', 'sample.jpg', 'sample.jpg'], {
      op: 'removeBackground',
      output: 'imageData',
      onProgress: (completed, total) => log('progress', completed + '/' + total),
    });
    window.__result = results.map((r) => ({ ok: r.ok, size: r.result ? r.result.width + 'x' + r.result.height : null }));
    log('batch done', JSON.stringify(window.__result), Math.round(performance.now() - t0) + 'ms');

    const harm = await batch([{ image: 'sample.jpg' }], { op: 'colorize', output: 'imageData' });
    log('colorize batch', harm.map((r) => r.ok));
  } catch (e) {
    window.__error = String((e && e.stack) || e);
    log('ERR', e);
  }
  window.__ready = true;
})();
</script>
